spring:
  application:
    name: eduhub
  # 프로필 기본값 없음(NFR-03 최종 검토 W1). 지정하지 않으면 DB 설정이 없어 기동이 실패한다. 로컬은 bootRun이 dev를 지정한다.
  config:
    # 저장소 루트의 .env(KEY=VALUE)를 설정으로 읽는다. backend/에서 실행하면 ../.env, 루트에서 실행하면 ./.env.
    import: "optional:file:../.env[.properties],optional:file:./.env[.properties]"
  jpa:
    # NFR-02: 뷰 렌더링 중 지연 로딩으로 생기는 N+1 쿼리를 막는다.
    open-in-view: false
    hibernate:
      # NFR-06: 스키마는 Flyway만 바꾼다. Hibernate는 검증만 한다.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  data:
    web:
      pageable:
        # NFR-02: 한 번에 너무 많이 읽지 않도록 페이지 크기 상한을 둔다.
        max-page-size: 100

eduhub:
  jwt:
    # NFR-03, NFR-06: 서명 키는 환경 변수(.env)로만 받는다. 기본값을 두지 않는다. 32바이트 이상.
    secret: ${EDUHUB_JWT_SECRET}
    ttl-minutes: 60

springdoc:
  swagger-ui:
    path: /swagger-ui.html
